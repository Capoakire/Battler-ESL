<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Routine Battle Engine</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --good: #22c55e;
    --bad: #ef4444;
    --gold: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e1b4b);
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
  }
  #game {
    width: 100%;
    max-width: 760px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    overflow: hidden;
    position: relative;
  }
  .header {
    background: linear-gradient(90deg, #1e3a8a, #4c1d95);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.95rem;
  }
  .header h1 { font-size: 1.15rem; font-weight: 700; }
  .arena {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 16px 14px 10px;
  }
  .fighter {
    background: rgba(15,23,42,0.7);
    border-radius: 14px;
    padding: 12px;
    text-align: center;
    border: 2px solid transparent;
    position: relative;
  }
  .fighter.player { border-color: #3b82f6; }
  .fighter.enemy  { border-color: #a855f7; }
  .emoji {
    font-size: 3.8rem;
    line-height: 1;
    margin-bottom: 4px;
    display: inline-block;
  }
  .fighter.hit .emoji { animation: shake 0.35s; }
  .fighter.crit .emoji { animation: critPulse 0.45s; }
  .fighter.defeat .emoji { animation: fall 0.7s forwards; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  @keyframes critPulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.25); filter: brightness(1.4); }
    100% { transform: scale(1); }
  }
  @keyframes fall {
    to { transform: translateY(40px) rotate(15deg); opacity: 0; }
  }
  .name { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
  .status {
    font-size: 0.72rem;
    min-height: 16px;
    margin-bottom: 4px;
    color: #fbbf24;
  }
  .hp-bar {
    height: 12px;
    background: #334155;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 2px;
  }
  .hp-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  .player .hp-fill { background: linear-gradient(90deg, #22c55e, #16a34a); }
  .enemy  .hp-fill { background: linear-gradient(90deg, #a855f7, #7c3aed); }
  .hp-text { font-size: 0.78rem; opacity: 0.85; }
  #log {
    height: 90px;
    overflow-y: auto;
    padding: 8px 14px;
    font-size: 0.88rem;
    line-height: 1.35;
    background: rgba(0,0,0,0.28);
    border-top: 1px solid #334155;
    border-bottom: 1px solid #334155;
  }
  #log .good { color: #4ade80; }
  #log .bad  { color: #f87171; }
  #log .info { color: #93c5fd; }
  #log .crit { color: #fbbf24; font-weight: 700; }
  #log .status { color: #c084fc; }
  .tabs {
    display: flex;
    background: #0f172a;
  }
  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    background: #1e293b;
    border: none;
    color: #94a3b8;
  }
  .tab.active {
    background: #334155;
    color: white;
  }
  #actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 12px 14px 16px;
  }
  .act {
    background: #334155;
    border: none;
    color: white;
    padding: 12px 10px;
    border-radius: 11px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
  }
  .act:hover:not(:disabled) { background: #475569; }
  .act:disabled { opacity: 0.4; cursor: not-allowed; }
  .act small {
    display: block;
    font-size: 0.72rem;
    opacity: 0.7;
    font-weight: 400;
    margin-top: 2px;
  }
  .screen, #levelup {
    position: absolute;
    inset: 0;
    background: rgba(15,23,42,0.96);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 14px;
    z-index: 20;
    text-align: center;
    padding: 28px;
  }
  #levelup { z-index: 30; }
  .screen h2, #levelup h2 { font-size: 1.9rem; }
  #levelup h2 { color: var(--gold); }
  .btn {
    background: var(--accent);
    color: #0f172a;
    border: none;
    padding: 13px 28px;
    border-radius: 12px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="game">
  <!-- Start Screen -->
  <div id="start-screen" class="screen">
    <h2>Daily Routine<br>Battle Engine</h2>
    <p>Turn-based combat with critical hits, status effects, items & leveling.</p>
    <button class="btn" id="start-btn">Start Adventure</button>
  </div>

  <!-- Battle UI -->
  <div id="battle-ui" class="hidden">
    <div class="header">
      <h1>Daily Routine RPG</h1>
      <div>Lv.<span id="level">1</span> · <span id="stage">Battle 1</span> · Score <span id="score">0</span></div>
    </div>
    <div class="arena">
      <div class="fighter player" id="player-card">
        <div class="emoji" id="player-emoji">🦸</div>
        <div class="name">You</div>
        <div class="status" id="player-status"></div>
        <div class="hp-bar"><div class="hp-fill" id="player-hp-fill"></div></div>
        <div class="hp-text" id="player-hp-text">HP 50/50</div>
      </div>
      <div class="fighter enemy" id="enemy-card">
        <div class="emoji" id="enemy-emoji">🛏️</div>
        <div class="name" id="enemy-name">Wake up</div>
        <div class="status" id="enemy-status"></div>
        <div class="hp-bar"><div class="hp-fill" id="enemy-hp-fill"></div></div>
        <div class="hp-text" id="enemy-hp-text">HP 30/30</div>
      </div>
    </div>
    <div id="log"></div>
    <div class="tabs">
      <button class="tab active" data-tab="attack">Attack</button>
      <button class="tab" data-tab="item">Items</button>
    </div>
    <div id="actions"></div>
  </div>

  <!-- Level Up -->
  <div id="levelup" class="hidden">
    <h2>Level Up!</h2>
    <p id="levelup-text"></p>
    <button class="btn" id="levelup-btn">Continue</button>
  </div>

  <!-- End Screen -->
  <div id="end-screen" class="screen hidden">
    <h2 id="end-title">Victory!</h2>
    <p id="end-text"></p>
    <button class="btn" id="restart-btn">Play Again</button>
  </div>
</div>

<script>
const PLAYER_MOVES = [
  { name: "Alarm Blast",      power: 14, acc: 92, crit: 18, desc: "Strong physical hit" },
  { name: "Toothbrush Slash", power: 10, acc: 100, crit: 12, desc: "Reliable damage" },
  { name: "Coffee Rush",      power: 8,  acc: 88, crit: 25, desc: "High crit chance" },
  { name: "Focus Guard",      power: 0,  acc: 100, crit: 0,  desc: "Defense up + cure status" }
];

const ITEMS = [
  { id: "potion", name: "Potion",       desc: "Restore 28 HP",          count: 3 },
  { id: "energy", name: "Energy Drink", desc: "Restore 18 HP + ATK up",  count: 2 },
  { id: "focus",  name: "Focus Pill",   desc: "Cure all status effects", count: 2 }
];

const ENEMIES = [
  { name: "Wake up",     emoji: "🛏️", maxHp: 34, atk: 8,  moves: [
    { name: "Snooze", power: 7, acc: 90 }, { name: "Heavy Blanket", power: 11, acc: 80 },
    { name: "Dream Drift", power: 5, acc: 95, effect: "sleep" }
  ]},
  { name: "Brush teeth", emoji: "🪥", maxHp: 38, atk: 9,  moves: [
    { name: "Foam Spray", power: 9, acc: 95 }, { name: "Mint Sting", power: 12, acc: 85, effect: "burn" },
    { name: "Brush Combo", power: 8, acc: 100 }
  ]},
  { name: "Commute",     emoji: "🚌", maxHp: 42, atk: 10, moves: [
    { name: "Traffic Jam", power: 10, acc: 90 }, { name: "Late Bell", power: 14, acc: 75, effect: "stun" },
    { name: "Crowd Push", power: 9, acc: 95 }
  ]},
  { name: "Homework",    emoji: "📚", maxHp: 46, atk: 11, moves: [
    { name: "Page Flip", power: 10, acc: 100 }, { name: "Deadline Panic", power: 15, acc: 80, effect: "burn" },
    { name: "Equation Storm", power: 11, acc: 90 }
  ]},
  { name: "Dinner",      emoji: "🍲", maxHp: 40, atk: 10, moves: [
    { name: "Spice Burn", power: 12, acc: 85, effect: "burn" }, { name: "Full Plate", power: 9, acc: 100 },
    { name: "Chop Attack", power: 13, acc: 80 }
  ]},
  { name: "Sleep",       emoji: "🌙", maxHp: 44, atk: 11, moves: [
    { name: "Yawn Wave", power: 9, acc: 95, effect: "sleep" }, { name: "Pillow Slam", power: 14, acc: 80 },
    { name: "Deep Slumber", power: 7, acc: 100, effect: "sleep" }
  ]},
  { name: "The Teacher", emoji: "👨‍🏫", maxHp: 62, atk: 13, isBoss: true, moves: [
    { name: "Lesson Plan", power: 13, acc: 90 }, { name: "Pop Quiz", power: 17, acc: 75, effect: "stun" },
    { name: "Detention", power: 11, acc: 100, effect: "burn" }, { name: "Final Exam", power: 20, acc: 70 }
  ]}
];

class BattleEngine {
  constructor() {
    this.resetPlayer();
    this.enemies = [];
    this.index = 0;
    this.score = 0;
    this.busy = false;
    this.guard = false;
    this.currentTab = "attack";
    this.items = [];

    this.$ = {
      start: document.getElementById("start-screen"),
      battle: document.getElementById("battle-ui"),
      end: document.getElementById("end-screen"),
      levelup: document.getElementById("levelup"),
      playerEmoji: document.getElementById("player-emoji"),
      enemyEmoji: document.getElementById("enemy-emoji"),
      enemyName: document.getElementById("enemy-name"),
      playerFill: document.getElementById("player-hp-fill"),
      enemyFill: document.getElementById("enemy-hp-fill"),
      playerText: document.getElementById("player-hp-text"),
      enemyText: document.getElementById("enemy-hp-text"),
      playerCard: document.getElementById("player-card"),
      enemyCard: document.getElementById("enemy-card"),
      playerStatus: document.getElementById("player-status"),
      enemyStatus: document.getElementById("enemy-status"),
      log: document.getElementById("log"),
      actions: document.getElementById("actions"),
      stage: document.getElementById("stage"),
      score: document.getElementById("score"),
      level: document.getElementById("level"),
      endTitle: document.getElementById("end-title"),
      endText: document.getElementById("end-text"),
      levelupText: document.getElementById("levelup-text")
    };

    document.getElementById("start-btn").addEventListener("click", () => this.start());
    document.getElementById("restart-btn").addEventListener("click", () => this.start());
    document.getElementById("levelup-btn").addEventListener("click", () => {
      this.$.levelup.classList.add("hidden");
      this.nextEnemy();
    });

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        this.currentTab = tab.dataset.tab;
        this.renderActions();
      });
    });
  }

  resetPlayer() {
    this.player = {
      level: 1, maxHp: 50, hp: 50, atk: 11,
      exp: 0, nextExp: 25,
      status: null, statusTurns: 0, atkBoost: 0
    };
  }

  start() {
    this.resetPlayer();
    this.enemies = ENEMIES.map(e => ({
      ...e, hp: e.maxHp, status: null, statusTurns: 0
    }));
    this.index = 0;
    this.score = 0;
    this.busy = false;
    this.guard = false;
    this.items = ITEMS.map(i => ({ ...i }));
    this.currentTab = "attack";

    this.$.start.classList.add("hidden");
    this.$.end.classList.add("hidden");
    this.$.levelup.classList.add("hidden");
    this.$.battle.classList.remove("hidden");
    this.$.score.textContent = "0";
    this.$.level.textContent = "1";
    this.clearLog();
    this.nextEnemy();
  }

  get enemy() { return this.enemies[this.index]; }

  nextEnemy() {
    if (this.index >= this.enemies.length) {
      this.end(true);
      return;
    }
    const e = this.enemy;
    this.$.enemyEmoji.textContent = e.emoji;
    this.$.enemyName.textContent = e.name;
    this.$.enemyCard.classList.remove("defeat", "hit", "crit");
    this.$.playerCard.classList.remove("hit", "crit");
    this.$.stage.textContent = e.isBoss ? "FINAL BOSS" : `Battle ${this.index + 1}`;
    this.updateBars();
    this.updateStatusDisplay();
    this.log(`${e.name} appears!`, "info");
    this.renderActions();
    this.busy = false;
  }

  renderActions() {
    this.$.actions.innerHTML = "";
    if (this.currentTab === "attack") {
      PLAYER_MOVES.forEach(m => {
        const btn = document.createElement("button");
        btn.className = "act";
        btn.innerHTML = `${m.name}<small>${m.desc}</small>`;
        btn.onclick = () => this.playerAttack(m);
        this.$.actions.appendChild(btn);
      });
    } else {
      this.items.forEach(item => {
        const btn = document.createElement("button");
        btn.className = "act";
        btn.disabled = item.count <= 0;
        btn.innerHTML = `${item.name} ×${item.count}<small>${item.desc}</small>`;
        btn.onclick = () => this.useItem(item);
        this.$.actions.appendChild(btn);
      });
    }
  }

  async playerAttack(move) {
    if (this.busy) return;
    this.busy = true;
    this.disableActions(true);
    this.guard = false;

    // Sleep / Stun
    if (this.player.status === "sleep" || this.player.status === "stun") {
      this.log(`You are ${this.player.status} and can't move!`, "status");
      this.player.statusTurns--;
      if (this.player.statusTurns <= 0) {
        this.player.status = null;
        this.log("You recovered!", "good");
      }
      this.updateStatusDisplay();
      await this.wait(800);
      await this.enemyTurn();
      return;
    }

    if (Math.random() * 100 > move.acc) {
      this.log(`You used ${move.name}... but it missed!`, "bad");
      await this.wait(700);
      await this.enemyTurn();
      return;
    }

    if (move.power === 0) { // Focus Guard
      this.guard = true;
      this.player.status = null;
      this.player.statusTurns = 0;
      this.log("Focus Guard! Defense up + status cleared.", "good");
      this.updateStatusDisplay();
      await this.wait(700);
      await this.enemyTurn();
      return;
    }

    let dmg = this.calcDamage(this.player.atk + this.player.atkBoost, move.power);
    const isCrit = Math.random() * 100 < move.crit;
    if (isCrit) {
      dmg = Math.floor(dmg * 1.75);
      this.$.enemyCard.classList.add("crit");
      this.log(`CRITICAL HIT! ${move.name} deals ${dmg}!`, "crit");
    } else {
      this.$.enemyCard.classList.add("hit");
      this.log(`You used ${move.name}! Dealt ${dmg} damage.`, "good");
    }

    this.enemy.hp = Math.max(0, this.enemy.hp - dmg);
    this.updateBars();
    await this.wait(550);
    this.$.enemyCard.classList.remove("hit", "crit");

    // Enemy burn tick
    if (this.enemy.status === "burn" && this.enemy.hp > 0) {
      const burn = Math.max(2, Math.floor(this.enemy.maxHp * 0.06));
      this.enemy.hp = Math.max(0, this.enemy.hp - burn);
      this.log(`${this.enemy.name} takes ${burn} burn damage.`, "status");
      this.updateBars();
      await this.wait(350);
    }

    if (this.enemy.hp <= 0) {
      await this.handleEnemyDefeat();
      return;
    }
    await this.enemyTurn();
  }

  async useItem(item) {
    if (this.busy || item.count <= 0) return;
    this.busy = true;
    this.disableActions(true);
    item.count--;

    if (item.id === "potion") {
      const heal = 28;
      this.player.hp = Math.min(this.player.maxHp, this.player.hp + heal);
      this.log(`Used Potion! +${heal} HP.`, "good");
    } else if (item.id === "energy") {
      const heal = 18;
      this.player.hp = Math.min(this.player.maxHp, this.player.hp + heal);
      this.player.atkBoost = 4;
      this.log(`Used Energy Drink! +${heal} HP and Attack up!`, "good");
    } else if (item.id === "focus") {
      this.player.status = null;
      this.player.statusTurns = 0;
      this.log("Used Focus Pill! Status cured.", "good");
    }
    this.updateBars();
    this.updateStatusDisplay();
    await this.wait(700);
    await this.enemyTurn();
  }

  async enemyTurn() {
    const e = this.enemy;

    if (e.status === "sleep" || e.status === "stun") {
      this.log(`${e.name} is ${e.status}!`, "status");
      e.statusTurns--;
      if (e.statusTurns <= 0) e.status = null;
      this.updateStatusDisplay();
      await this.wait(700);
      this.finishTurn();
      return;
    }

    const move = e.moves[Math.floor(Math.random() * e.moves.length)];
    if (Math.random() * 100 > move.acc) {
      this.log(`${e.name} used ${move.name}... missed!`, "info");
      await this.wait(700);
      this.finishTurn();
      return;
    }

    let dmg = this.calcDamage(e.atk, move.power, this.guard ? 2.3 : 1);
    this.player.hp = Math.max(0, this.player.hp - dmg);
    this.$.playerCard.classList.add("hit");
    this.log(`${e.name} used ${move.name}! Dealt ${dmg} damage.`, "bad");
    this.updateBars();

    if (move.effect && !this.player.status && Math.random() < 0.55) {
      this.player.status = move.effect;
      this.player.statusTurns = move.effect === "burn" ? 3 : 2;
      this.log(`You are now ${move.effect.toUpperCase()}!`, "status");
      this.updateStatusDisplay();
    }

    await this.wait(500);
    this.$.playerCard.classList.remove("hit");

    // Player burn tick
    if (this.player.status === "burn" && this.player.hp > 0) {
      const burn = Math.max(2, Math.floor(this.player.maxHp * 0.05));
      this.player.hp = Math.max(0, this.player.hp - burn);
      this.log(`You take ${burn} burn damage.`, "status");
      this.updateBars();
      await this.wait(350);
    }

    if (this.player.hp <= 0) {
      this.log("You ran out of energy...", "bad");
      await this.wait(900);
      this.end(false);
      return;
    }

    if (this.player.atkBoost > 0) this.player.atkBoost--;
    this.finishTurn();
  }

  async handleEnemyDefeat() {
    this.$.enemyCard.classList.add("defeat");
    this.score++;
    this.$.score.textContent = this.score;
    this.log(`${this.enemy.name} was defeated!`, "good");

    const expGain = this.enemy.isBoss ? 40 : 18 + this.index * 3;
    this.player.exp += expGain;
    this.log(`Gained ${expGain} EXP.`, "info");
    await this.wait(900);

    if (this.enemy.isBoss) {
      this.log("The Teacher falls! You mastered the daily routine!", "good");
      await this.wait(1100);
      this.end(true);
      return;
    }

    this.index++;
    if (this.player.exp >= this.player.nextExp) {
      this.doLevelUp();
    } else {
      this.nextEnemy();
    }
  }

  doLevelUp() {
    this.player.level++;
    this.player.exp -= this.player.nextExp;
    this.player.nextExp = Math.floor(this.player.nextExp * 1.45);
    const hpGain = 6 + Math.floor(Math.random() * 4);
    const atkGain = 1 + (Math.random() < 0.5 ? 1 : 0);
    this.player.maxHp += hpGain;
    this.player.hp = this.player.maxHp;
    this.player.atk += atkGain;
    this.$.level.textContent = this.player.level;
    this.$.levelupText.innerHTML = `
      You reached <strong>Level ${this.player.level}</strong>!<br>
      Max HP +${hpGain} → ${this.player.maxHp}<br>
      Attack +${atkGain} → ${this.player.atk}`;
    this.$.levelup.classList.remove("hidden");
  }

  finishTurn() {
    this.busy = false;
    this.disableActions(false);
    this.renderActions();
  }

  calcDamage(atk, power, defMult = 1) {
    const base = (atk * power) / 11;
    const variance = 0.82 + Math.random() * 0.36;
    return Math.max(1, Math.floor(base * variance / defMult));
  }

  updateBars() {
    this.$.playerFill.style.width = (this.player.hp / this.player.maxHp * 100) + "%";
    this.$.enemyFill.style.width  = (this.enemy.hp / this.enemy.maxHp * 100) + "%";
    this.$.playerText.textContent = `HP ${this.player.hp}/${this.player.maxHp}`;
    this.$.enemyText.textContent  = `HP ${this.enemy.hp}/${this.enemy.maxHp}`;
  }

  updateStatusDisplay() {
    this.$.playerStatus.textContent = this.player.status
      ? `⚡ ${this.player.status.toUpperCase()} (${this.player.statusTurns})`
      : (this.player.atkBoost > 0 ? "⬆ ATK" : "");
    this.$.enemyStatus.textContent = this.enemy.status
      ? `⚡ ${this.enemy.status.toUpperCase()} (${this.enemy.statusTurns})`
      : "";
  }

  log(text, type = "") {
    const div = document.createElement("div");
    div.className = type;
    div.textContent = text;
    this.$.log.appendChild(div);
    this.$.log.scrollTop = this.$.log.scrollHeight;
  }

  clearLog() { this.$.log.innerHTML = ""; }

  disableActions(state) {
    [...this.$.actions.children].forEach(b => b.disabled = state);
  }

  end(victory) {
    this.$.battle.classList.add("hidden");
    this.$.end.classList.remove("hidden");
    if (victory) {
      this.$.endTitle.textContent = "Victory!";
      this.$.endText.textContent = `You conquered every daily task!\nFinal Level: ${this.player.level}\nScore: ${this.score}`;
    } else {
      this.$.endTitle.textContent = "Defeat";
      this.$.endText.textContent = `The daily grind overwhelmed you.\nReached Level ${this.player.level}\nScore: ${this.score}`;
    }
  }

  wait(ms) {
    return new Promise(r => setTimeout(r, ms));
  }
}

// Start the engine
window.addEventListener("DOMContentLoaded", () => {
  new BattleEngine();
});
</script>
</body>
</html>
